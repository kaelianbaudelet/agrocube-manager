<!doctype html>
<html lang="fr" class="hud-theme">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Workshop EPSI</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap"
		/>
		<style>
			/* Dark background before React mounts, to avoid a white flash. */
			html, body { margin: 0; background: oklch(0.13 0.02 235); }
			/* Static logo shown while the JS loads; React replaces #root's content when it mounts. */
			#splash {
				position: fixed; inset: 0; overflow: hidden;
				display: flex; align-items: center; justify-content: center;
				padding: 0 16px;
				font: 900 clamp(1.75rem, 7vw, 4rem) / 1 "Orbitron", "Share Tech Mono", ui-monospace, monospace;
				letter-spacing: 0.25em;
				color: oklch(0.84 0.14 200);
				text-shadow: 0 0 10px oklch(0.84 0.14 200 / 0.55);
			}
			/* letter-spacing also adds space after the last letter: cancel it to stay optically centred. */
			#splash span { margin-right: -0.25em; }
		</style>
	</head>
	<body>
		<div id="root"><div id="splash" role="status" aria-label="Chargement"><span>AGRO·CUBE</span></div></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
